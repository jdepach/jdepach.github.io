<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Éditeur d'aventure</title>
<style>
:root{--bg:#fbf6ea;--ink:#1d1520;--accent:#d3126b;--hi:#ffd400;--font:"Barlow Semi Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font)}
header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.8rem 1rem;background:var(--ink);color:var(--bg)}
header input{flex:1;min-width:10rem;font:700 1.2rem var(--font)}
.wrap{display:grid;grid-template-columns:16rem 1fr;min-height:calc(100vh - 4rem)}
@media(max-width:700px){.wrap{grid-template-columns:1fr}}
nav{padding:1rem;border-right:2px solid var(--ink);display:grid;gap:.4rem;align-content:start}
nav button.on{background:var(--hi);font-weight:700}
nav button{text-align:left}
#form{padding:1rem 1.5rem;max-width:44rem;display:grid;gap:.7rem;align-content:start}
label{display:grid;gap:.2rem;font-weight:700}
input,textarea,select{font:1rem var(--font);padding:.5rem;border:2px solid var(--ink);border-radius:.25rem;background:#fff;color:#111}
textarea{min-height:11rem;font-family:Georgia,serif;line-height:1.6}
button{font:600 1rem var(--font);padding:.45rem .8rem;border:2px solid var(--accent);background:transparent;color:inherit;border-radius:.25rem;cursor:pointer}
button:hover{background:var(--accent);color:#fff}
.choix{display:grid;grid-template-columns:1fr 1fr auto;gap:.4rem}
.rouge{color:var(--accent)}
</style>
</head>
<body>
<header>
  <input id="titre" aria-label="Titre de l'aventure" placeholder="Titre de l'aventure">
  <button id="ouvrir">Ouvrir story.json</button>
  <button id="enreg">Enregistrer story.json</button>
  <input type="file" id="fichier" accept=".json" hidden>
</header>
<div class="wrap">
  <nav id="liste"></nav>
  <section id="form"></section>
</div>
<script>
let S = { title: 'Mon aventure', start: 'debut', nodes: { debut: { title: 'Début', text: '', choices: [] } } };
let cur = 'debut', modifie = false;
const $ = s => document.querySelector(s);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  kids.forEach(k => e.append(k));
  return e;
}
const touche = () => { modifie = true; };

function rendreListe() {
  const l = $('#liste');
  l.replaceChildren(el('button', { textContent: '+ Nouveau bloc', onclick: nouveau }));
  Object.keys(S.nodes).forEach(id => {
    const n = S.nodes[id];
    const casse = n.choices.some(c => !S.nodes[c.to]);
    l.append(el('button', {
      className: id === cur ? 'on' : '',
      textContent: (id === S.start ? '★ ' : '') + (n.title || id) + (casse ? ' ⚠' : ''),
      onclick: () => { cur = id; rendre(); }
    }));
  });
}

function rendreForm() {
  const f = $('#form');
  f.replaceChildren();
  const n = S.nodes[cur];
  if (!n) { f.append(el('p', { textContent: 'Choisis un bloc dans la liste.' })); return; }

  const iid = el('input', { value: cur, onchange: () => renommer(iid.value.trim()) });
  const ititre = el('input', { value: n.title || '', oninput: () => { n.title = ititre.value; touche(); rendreListe(); } });
  const itexte = el('textarea', { value: n.text || '', oninput: () => { n.text = itexte.value; touche(); } });
  f.append(
    el('label', { textContent: 'Identifiant (utilisé dans les liens)' }, iid),
    el('label', { textContent: 'Titre du bloc' }, ititre),
    el('label', { textContent: 'Texte (une ligne vide = nouveau paragraphe)' }, itexte),
    el('strong', { textContent: 'Choix proposés' })
  );

  n.choices.forEach((c, i) => {
    const lab = el('input', { value: c.label, placeholder: 'Texte du bouton', oninput: () => { c.label = lab.value; touche(); } });
    const sel = el('select', { onchange: () => { c.to = sel.value; touche(); rendreListe(); } },
      el('option', { value: '', textContent: '— choisir la suite —' }));
    Object.keys(S.nodes).forEach(id => {
      sel.append(el('option', { value: id, textContent: S.nodes[id].title || id, selected: id === c.to }));
    });
    const sup = el('button', { textContent: '✕', title: 'Supprimer ce choix', onclick: () => { n.choices.splice(i, 1); touche(); rendre(); } });
    f.append(el('div', { className: 'choix' }, lab, sel, sup));
  });

  f.append(
    el('button', { textContent: '+ Ajouter un choix', onclick: () => { n.choices.push({ label: '', to: '' }); touche(); rendreForm(); } }),
    el('button', { textContent: 'Faire de ce bloc le début', onclick: () => { S.start = cur; touche(); rendre(); } }),
    el('button', { className: 'rouge', textContent: 'Supprimer ce bloc', onclick: supprimer })
  );
}

function rendre() { rendreListe(); rendreForm(); }

function nouveau() {
  let i = 1;
  while (S.nodes['bloc-' + i]) i++;
  const id = 'bloc-' + i;
  S.nodes[id] = { title: 'Nouveau bloc', text: '', choices: [] };
  cur = id; touche(); rendre();
}

function renommer(nv) {
  if (!nv || nv === cur) return rendreForm();
  if (S.nodes[nv]) { alert('Cet identifiant existe déjà.'); return rendreForm(); }
  const neuf = {};
  Object.keys(S.nodes).forEach(k => { neuf[k === cur ? nv : k] = S.nodes[k]; });
  Object.values(neuf).forEach(n => n.choices.forEach(c => { if (c.to === cur) c.to = nv; }));
  if (S.start === cur) S.start = nv;
  S.nodes = neuf; cur = nv; touche(); rendre();
}

function supprimer() {
  if (cur === S.start) return alert("Impossible de supprimer le bloc de départ.");
  if (!confirm('Supprimer ce bloc ? Les choix qui y mènent seront marqués ⚠.')) return;
  delete S.nodes[cur];
  cur = S.start; touche(); rendre();
}

$('#titre').oninput = e => { S.title = e.target.value; touche(); };
$('#ouvrir').onclick = () => $('#fichier').click();
$('#fichier').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d.nodes || !d.start) throw new Error();
      Object.values(d.nodes).forEach(n => { n.choices = n.choices || []; });
      S = d; cur = d.start; modifie = false;
      $('#titre').value = S.title || '';
      rendre();
    } catch { alert("Ce fichier n'est pas une histoire valide."); }
  };
  r.readAsText(f);
};
$('#enreg').onclick = () => {
  const cassés = Object.values(S.nodes).some(n => n.choices.some(c => !S.nodes[c.to]));
  if (cassés && !confirm('Certains choix ne mènent nulle part (⚠). Enregistrer quand même ?')) return;
  const a = el('a', {
    href: URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })),
    download: 'story.json'
  });
  a.click(); modifie = false;
};
window.onbeforeunload = () => modifie ? 'Modifications non enregistrées' : undefined;

$('#titre').value = S.title;
rendre();
fetch('story.json').then(r => r.json()).then(d => {
  Object.values(d.nodes).forEach(n => { n.choices = n.choices || []; });
  S = d; cur = d.start; $('#titre').value = S.title; rendre();
}).catch(() => {});
</script>
</body>
</html>
